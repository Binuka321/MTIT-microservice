server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # 🔹 PRODUCT SERVICE
        - id: product-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1

        # 🔹 PAYMENT SERVICE
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1

        # 🔹 USER SERVICE
        - id: users-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        # 🔹 INVENTORY SERVICE
        - id: inventory-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

        # 🔹 ORDER SERVICE
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1